# Properties used by @ActiveProfiles("test") so that tests never use real credentials,
# live output directories or multi-page pagination.
output.base-path=${java.io.tmpdir}/scraper-test-output
logging.file.path=${java.io.tmpdir}/scraper-test-logs

reed.api.key=test-reed-key
reed.api.base-url=https://www.reed.co.uk/api/1.0/search

adzuna.api.base-url=https://api.adzuna.com/v1/api/jobs/gb/search
adzuna.api.app-id=test-app-id
adzuna.api.app-key=test-app-key

scraping.max-pages=1
scraping.results-per-page=50
scraping.max-retries=0
scraping.retry-backoff=0ms
